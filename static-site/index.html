<body>
  <div id="app">

  <script>
    const { createApp } = Vue
    const { createRouter, createWebHashHistory } = VueRouter

    const allArticles = [
      { id: 'culture-1', title: '酱酒历史溯源：从远古到现代的千年传承', summary: '深入探索酱酒的起源与发展，从茅台镇的地理环境到现代酱酒产业的形成', icon: '📜', author: '酱酒文化研究中心', views: 12568, category: 'culture',
        content: '<p>酱酒，作为中国白酒的瑰宝，拥有着悠久的历史和深厚的文化底蕴。</p><h2>历史沿革</h2><h3>远古时期</h3><p>早在秦汉时期，仁怀地区就已经开始酿酒。</p><h3>唐宋发展</h3><p>唐宋时期，仁怀地区的酿酒技术日趋成熟。</p><h3>明清繁荣</h3><p>明清时期，茅台镇的酿酒业达到了一个新的高峰。"回沙工艺"的出现，标志着酱酒酿造技术的成熟。</p><h3>1915年巴拿马金奖</h3><p>1915年，茅台酒在巴拿马万国博览会上获得金奖，从此走向世界。</p><blockquote>酱酒文化，承载着千年的智慧与匠心，正在新时代焕发出新的光彩！</blockquote>' },
      { id: 'culture-2', title: '端午制曲：酱酒酿造的第一道神秘工序', summary: '详解端午制曲的文化内涵与工艺要点，探索微生物王国的奥秘', icon: '🌾', author: '酿酒大师工作室', views: 9876, category: 'culture',
        content: '<p>端午制曲，是酱酒酿造的第一道工序，也是最为神秘的环节之一。</p><h2>为什么选择端午？</h2><p>端午时节，赤水河沿岸气温升高、湿度增大，正是微生物最活跃的时期。</p><h2>制曲工艺流程</h2><ul><li><strong>小麦粉碎：</strong>将小麦粉碎成"梅花瓣"形状</li><li><strong>踩曲：</strong>女工们在曲块上轻快地踩踏</li><li><strong>入仓发酵：</strong>将踩好的曲块放入</li><li><strong>翻仓：</strong>每隔一段时间，进行翻仓</li></ul><blockquote>踩曲女工们轻快的脚步，是茅台镇最动人的风景！</blockquote>' },
      { id: 'culture-3', title: '重阳下沙：开启一年的酿酒之旅', summary: '重阳节为什么是酱酒投料的最佳时机？', icon: '🍂', author: '酱酒文化研究中心', views: 8765, category: 'culture',
        content: '<p>重阳下沙，是酱酒酿造的正式开始。</p><h2>为什么选择重阳？</h2><ul><li>红缨子高粱成熟，颗粒饱满</li><li>雨季过后，赤水河变得清澈甘甜</li><li>秋高气爽，气温适中</li><li>重阳节是中国传统节日</li></ul><blockquote>下沙，不仅是一道工序，更是一种仪式，一种文化！</blockquote>' },
      { id: 'culture-4', title: '赤水河：一条流淌着美酒的传奇河流', summary: '从云南到四川，赤水河孕育了中国最好的酱酒', icon: '🌊', author: '地理杂志社', views: 11234, category: 'culture',
        content: '<p>赤水河，中国唯一一条没有被污染的长江支流。</p><h2>河流概况</h2><p>这条全长500多公里的河流，孕育了中国最好的酱酒。</p><blockquote>赤水河，一条流淌着美酒、流淌着文化、流淌着传奇的河流！</blockquote>' },
      { id: 'culture-5', title: '红缨子高粱：酱酒的核心秘密', summary: '这种不起眼的小红高粱，为什么是酿造顶级酱酒的唯一选择？', icon: '🌾', author: '农业科技专家', views: 9456, category: 'culture',
        content: '<p>红缨子高粱，是茅台镇特产的一种高粱。</p><h2>红缨子高粱的特点</h2><ul><li><strong>颗粒小：</strong>只有普通高粱的一半大小</li><li><strong>皮厚：</strong>角质层厚，耐蒸煮</li><li><strong>淀粉含量高：</strong>支链淀粉含量高达90%以上</li><li><strong>单宁适中：</strong>能产生独特风味</li></ul><blockquote>可以说，没有红缨子高粱，就没有顶级酱酒！</blockquote>' },
      { id: 'culture-6', title: '陶坛储酒：时间的艺术，岁月的魔法', summary: '为什么酱酒要用陶坛储存？陶坛里发生了什么神奇的变化？', icon: '⏳', author: '储酒大师', views: 10567, category: 'culture',
        content: '<p>酱酒酿造的最后一道工序——储存。</p><h2>为什么选择陶坛？</h2><ul><li><strong>透气性好：</strong>陶坛有微小的气孔，能让酒液"呼吸"</li><li><strong>矿物质丰富：</strong>含有多种对人体有益的矿物质</li><li><strong>化学稳定：</strong>化学性质稳定</li><li><strong>传统工艺：</strong>使用陶坛储酒是中国白酒的传统工艺</li></ul><blockquote>所以，喝酱酒，喝的不只是酒，还是时间！</blockquote>' },
      { id: 'craft-1', title: '12987工艺详解：酱酒酿造的核心密码', summary: '一年生产周期、两次投料、九次蒸煮、八次发酵、七次取酒', icon: '📖', author: '国家级酿酒大师', views: 15678, category: 'craft',
        content: '<p>12987工艺，是坤沙酱酒的核心工艺。</p><h2>12987的含义</h2><ul><li><strong>1：</strong>一年生产周期</li><li><strong>2：</strong>两次投料</li><li><strong>9：</strong>九次蒸煮</li><li><strong>8：</strong>八次发酵</li><li><strong>7：</strong>七次取酒</li></ul><blockquote>12987，酱酒的密码，匠心的体现！</blockquote>' },
      { id: 'craft-2', title: '三高工艺：高温制曲、高温堆积、高温发酵', summary: '为什么酱酒要用"三高"工艺？', icon: '🔥', author: '酿酒技术专家', views: 12345, category: 'craft',
        content: '<p>酱酒酿造有"三高"：高温制曲、高温堆积、高温发酵。</p><h2>高温制曲</h2><p>制曲的温度要达到60℃以上，是所有白酒中最高的。</p><h2>高温堆积</h2><p>加曲后的高粱要堆成圆锥体，进行堆积发酵。</p><blockquote>正是这些"高"，造就了酱酒的高品质！</blockquote>' },
      { id: 'craft-3', title: '七轮次取酒：每一轮都有独特风味', summary: '七轮次酒各有什么特点？调酒师如何将它们完美组合？', icon: '🍷', author: '国家级调酒大师', views: 11234, category: 'craft',
        content: '<p>酱酒要取七次酒，每一轮次的酒都有不同的风味特点。</p><ul><li><strong>一轮次：</strong>酱香味淡，有点生粮味</li><li><strong>二轮次：</strong>酱香味渐浓，有点甜</li><li><strong>三轮次：</strong>酱香突出，醇和微甜</li><li><strong>四轮次：</strong>酱香醇厚，回味悠长</li><li><strong>五轮次：</strong>酱香明显，焦糊香好</li><li><strong>六轮次：</strong>焦糊香明显，微苦</li><li><strong>七轮次：</strong>焦糊香重，苦味明显</li></ul><blockquote>调酒师将它们按比例组合，才能形成独特的酱酒风味！</blockquote>' },
      { id: 'craft-4', title: '坤沙、碎沙、翻沙、窜沙：酱酒的分类', summary: '市场上的酱酒有哪些种类？它们有什么区别？', icon: '📊', author: '白酒鉴评专家', views: 14567, category: 'craft',
        content: '<p>市场上的酱酒主要分为四种：坤沙、碎沙、翻沙、窜沙。</p><h2>坤沙酒</h2><p>用完整的红缨子高粱酿造，12987工艺，品质最好。</p><h2>碎沙酒</h2><p>用粉碎的高粱酿造，品质次之。</p><h2>翻沙酒</h2><p>用酒糟再酿，品质一般。</p><h2>窜沙酒</h2><p>品质最差。</p><blockquote>买酱酒，尽量买坤沙或碎沙！</blockquote>' },
      { id: 'craft-5', title: '勾调艺术：酱酒的画龙点睛之笔', summary: '勾调不是"兑水"，而是艺术', icon: '🎨', author: '国家级调酒大师', views: 13456, category: 'craft',
        content: '<p>勾调，是酱酒酿造的最后一道关键工序。</p><h2>什么是勾调？</h2><p>将不同轮次、不同年份、不同风格的基酒，按照一定比例混合在一起，使酒的风味达到最佳状态。</p><blockquote>好的勾调，能让酒的品质提升一个档次！</blockquote>' },
      { id: 'craft-6', title: '石窖发酵：酱酒的摇篮', summary: '为什么酱酒要用石窖发酵？', icon: '🏛️', author: '发酵工程专家', views: 9876, category: 'craft',
        content: '<p>酱酒发酵要用石窖。</p><h2>为什么要用石窖？</h2><ul><li>材质稳定</li><li>透气性好</li><li>保温性好</li><li>微生物环境</li></ul><blockquote>石窖，酱酒的摇篮，微生物的乐园！</blockquote>' },
      { id: 'tasting-1', title: '酱酒品鉴入门：从视觉到味觉的感官之旅', summary: '详解观色、闻香、尝味、悟格四步品鉴法', icon: '👃', author: '国家级品酒师', views: 11456, category: 'tasting',
